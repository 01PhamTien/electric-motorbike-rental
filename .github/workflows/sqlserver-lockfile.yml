name: Temporary SQL Server lockfile refresh
on:
  push:
    branches: [feat/sqlserver-express-support-20261103]
    paths:
      - backend/package.json
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: backend
      - name: Commit generated lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(mssql): refresh npm lockfile for SQL Server driver"
            git push origin HEAD:feat/sqlserver-express-support-20261103
          fi
