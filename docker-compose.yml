services:
  mysql:
    image: mysql:8.4
    container_name: emr_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: electric_motorbike_rental
      MYSQL_USER: emr
      MYSQL_PASSWORD: emr123456
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-time-zone='+07:00'

volumes:
  mysql_data:
